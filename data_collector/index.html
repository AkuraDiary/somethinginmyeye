<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- touch-action: none prevents the tablet from scrolling when you draw -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Handwriting Data Collector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        canvas {
            border: 2px solid #333;
            touch-action: none;
            background-color: #fafafa;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h2>Handwriting Data Collector (And a part-timer Analyzer)</h2>
    <button id="analyzeBtn" style="background-color: #4CAF50; color: white;">Analyze Handwriting</button>
    <h3 id="resultText"></h3>

    <div id="promptArea" style="margin-bottom: 10px; padding: 15px; background-color: #f0f0f0; border-radius: 8px;">
        <h3>Prompt: Tulis huruf antara A - Z atau a - z (individual)</h3>
        <button id="startTimerBtn" style="background-color: #007bff; color: white; padding: 10px;">Start
            Writing</button>
        <span id="latencyDisplay" style="margin-left: 15px; font-weight: bold;">Latency: Waiting to start...</span>
    </div>

    <div class="controls">
        <label for="modeSelect">Mode:</label>
        <select id="modeSelect">
            <option value="normal">Normal</option>
            <option value="dyslexia">Dyslexia</option>
        </select>

        <label for="labelInput">Label:</label>
        <input type="text" id="labelInput" placeholder="e.g., test_1" />
    </div>
    <!-- The canvas where you will write -->
    <canvas id="drawCanvas" width="800" height="400"></canvas>

    <div class="controls">
        <!-- <button id="downloadImgBtn">Download Image</button> -->
        <!-- <button id="downloadBtn">Download CSV</button> -->
        <button id="downloadBtn">Save Sample (In Server)</button>
        <button id="clearBtn">Clear Canvas</button>
    </div>

    <script>
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        ctx.lineWidth = 4;       // Makes the line 4 pixels thick
        ctx.lineCap = 'round';   // Makes the ends of the strokes round and smooth
        let isDrawing = false;
        let promptStartTime = 0;
        let latencyMs = 0;
        let hasStartedWriting = false;

        function clearCanvas(){
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            strokeData = [];
        }
        // When the user clicks Start, the timer begins!
        document.getElementById('startTimerBtn').addEventListener('click', () => {
            promptStartTime = Date.now();
            hasStartedWriting = false;
            document.getElementById('latencyDisplay').innerText = "Latency: Timing cognitive delay...";

            // Clear the canvas for a fresh start
            clearCanvas();
        });

        // This array will hold the time-series data
        let strokeData = [];

        
        function recordPoint(e, isTouching) {
            // Extract the data from the PointerEvent 'e'
            // Useful properties: 
            // e.timeStamp (milliseconds)
            // e.offsetX, e.offsetY (coordinates)
            // e.pressure (0.0 to 1.0 - works with Apple Pencil/Stylus)
            // Push an object or array representing [time, x, y, pressure, isTouching] into strokeData
            // Save the time, X, Y, pressure, and whether the pen is touching the screen
            strokeData.push({
                time: e.timeStamp,
                x: e.offsetX,
                y: e.offsetY,
                pressure: e.pressure || 0.5, // Fallback to 0.5 if mouse is used instead of a stylus
                touching: isTouching
            });
        }

        // --- Event Listeners ---
        canvas.addEventListener('pointerdown', (e) => {

            // latency calculation
            if (promptStartTime > 0 && !hasStartedWriting) {
                latencyMs = Date.now() - promptStartTime;
                hasStartedWriting = true;
                document.getElementById('latencyDisplay').innerText = `Latency: ${latencyMs} ms`;
            }

            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
            recordPoint(e, 1);
        });

        canvas.addEventListener('pointermove', (e) => {
            // Check if isDrawing is true. 
            // If so, draw a line to the new (e.offsetX, e.offsetY) using ctx.lineTo() and ctx.stroke().
            // Then, call recordPoint(e, 1).
            if (isDrawing) {
                ctx.lineWidth = e.pressure * 5;// just to make visual difference
                ctx.lineTo(e.offsetX, e.offsetY);
                ctx.stroke();
                recordPoint(e, 1);
            }
        });

        canvas.addEventListener('pointerup', (e) => {
            isDrawing = false;
            recordPoint(e, 0); // Pen lifted
        });

        canvas.addEventListener('pointerout', (e) => {
            if (isDrawing) {
                isDrawing = false;
                recordPoint(e, 0); // Pen left the canvas
            }
        });

        // --- Controls ---

        // Change the button text in your HTML to "Save to Server" if you want!
        document.getElementById('downloadBtn').addEventListener('click', async () => {
             const resultText = document.getElementById('resultText');

             if (strokeData.length === 0) {
                resultText.style.color = "orange";
                resultText.innerText = "⚠️ Please draw something on the canvas first!";
                return;
            }
            
            const mode = document.getElementById('modeSelect').value;
            const prefix = document.getElementById('labelInput').value || 'sample';
            
            // 1. Grab the Image
            const imageBase64 = canvas.toDataURL("image/png");
            
            // 2. Grab the CSV data (and inject latency)
            const strokesWithLatency = strokeData.map(point => {
                return { ...point, latency: latencyMs };
            });
            
            // 3. Package them together
            const payload = {
                mode: mode,
                prefix: prefix,
                strokes: strokesWithLatency,
                image: imageBase64
            };
            
            // 4. Send to Python!
            try {
                const response = await fetch('/save_data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                // Show a quick popup so you know it worked
                alert(result.message); 
                
                // Optionally clear the canvas to get ready for the next sample
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                strokeData = [];
                
            } catch (error) {
                alert("❌ Error saving data to server.");
            }
        });

        // document.getElementById('downloadImgBtn').addEventListener('click', () => {
        //     // Grab the same naming prefix you used for the CSV
        //     const mode = document.getElementById('modeSelect').value;
        //     const prefix = document.getElementById('labelInput').value || 'sample';
        //     const filename = `${mode}_${prefix}.png`;

        //     // Convert the canvas to a PNG image URL
        //     const dataURL = canvas.toDataURL("image/png");

        //     // Trigger download
        //     const a = document.createElement('a');
        //     a.href = dataURL;
        //     a.download = filename;
        //     document.body.appendChild(a);
        //     a.click();
        //     document.body.removeChild(a);
        // });
        // document.getElementById('downloadBtn').addEventListener('click', () => {
        //     const mode = document.getElementById('modeSelect').value;
        //     const prefix = document.getElementById('labelInput').value || 'sample';

        //     // Generate the smart filename
        //     const filename = `${mode}_${prefix}.csv`;

        //     // Build the CSV String (Removed the label column!)
        //     let csvContent = "time,x,y,pressure,touching,latency\n";

        //     strokeData.forEach(point => {
        //         csvContent += `${point.time},${point.x},${point.y},${point.pressure},${point.touching},${latencyMs}\n`;
        //     });


        //     // Trigger the download
        //     const blob = new Blob([csvContent], { type: 'text/csv' });
        //     const url = URL.createObjectURL(blob);

        //     const a = document.createElement('a');
        //     a.href = url;
        //     a.download = filename;
        //     document.body.appendChild(a);
        //     a.click();
        //     document.body.removeChild(a);
        // });

        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            strokeData = [];
            // clearCanvas();
        });
        document.getElementById('analyzeBtn').addEventListener('click', async () => {
            const resultText = document.getElementById('resultText');

            // Safeguard
            if (strokeData.length === 0) {
                resultText.style.color = "orange";
                resultText.innerText = "⚠️ Please draw something on the canvas first!";
                return;
            }
            // --------------------------

            resultText.style.color = "black";
            resultText.innerText = "🧠 Analyzing kinematics...";

            try {
                // Package the data together
                const strokesWithLatency = strokeData.map(point => {
                    return {
                        time: point.time,
                        x: point.x,
                        y: point.y,
                        pressure: point.pressure,
                        touching: point.touching,
                        latency: latencyMs // injected latency into the data instead of sending it as separate payload
                    };
                });
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(strokesWithLatency) // Send the unified array
                });

                
                const result = await response.json();
                const confidence = (result.probability * 100).toFixed(1);

                                // --- THE HEATMAP MAGIC ---
                if (result.heatmap && result.heatmap.length > 0) {
                    result.heatmap.forEach((prob, index) => {
                        // Make sure we don't try to draw past the actual recorded strokes
                        if (index < strokeData.length) {
                            
                            // If the AI is >80% confident that this exact millisecond is anomalous
                            if (prob > 0.80) { 
                                const point = strokeData[index];
                                
                                // Draw a glowing red circle at this exact X,Y coordinate!
                                ctx.beginPath();
                                ctx.arc(point.x, point.y, 8, 0, 2 * Math.PI);
                                ctx.fillStyle = "rgba(255, 0, 0, 0.1)"; // 10% opaque red
                                ctx.fill();
                            }
                        }
                    });
                }
                // -------------------------

                if (result.is_dyslexic) {
                    resultText.style.color = "red";
                    resultText.innerText = `⚠️ Dyslexic Pattern Detected (${confidence}% confidence)`;
                } else {
                    resultText.style.color = "green";
                    resultText.innerText = `✅ Normal Pattern (${(100 - confidence).toFixed(1)}% confidence)`;
                }
            } catch (error) {
                resultText.style.color = "red";
                resultText.innerText = "❌ Error connecting to AI server.";
            }
        });


    </script>
</body>


</html>
